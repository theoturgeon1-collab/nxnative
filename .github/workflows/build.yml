name: Test nxnative macOS

on:
  workflow_dispatch:

jobs:
  test-macos:
    runs-on: macos-26

    steps:
      - name: Télécharger nxnative
        uses: actions/checkout@v4

      - name: Vérifier les exigences
        run: |
          echo "=== macOS ==="
          sw_vers

          echo "=== Architecture ==="
          uname -m

          echo "=== Xcode ==="
          xcodebuild -version

          echo "=== Python ==="
          python3 --version

          echo "=== Homebrew ==="
          brew --version

          echo "=== Plateforme iOS ==="
          xcrun --sdk iphoneos --show-sdk-version
